<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your E-Housing account.">
  <title>Login | E-Housing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html" aria-label="E-Housing home">E-<span>Housing</span></a>
      <a class="login-home-link" href="index.html">← Back to Home</a>
    </div>
  </header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <a class="logo login-card-logo" href="index.html" aria-label="E-Housing home">E-<span>Housing</span></a>
      <p class="eyebrow eyebrow-dark">WELCOME BACK</p>
      <h1 id="login-title">Log in to your account</h1>
      <p class="login-subtitle">Find your place in Karnataka.</p>

      <form class="login-form">
        <label class="form-field" for="email">
          <span>Email address</span>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <label class="form-field" for="password">
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
        </label>
        <div class="login-options">
          <label class="remember-label"><input type="checkbox" name="remember"> Remember me</label>
          <a href="#login-title">Forgot password?</a>
        </div>
        <button class="btn login-submit" type="submit">Log In <span aria-hidden="true">→</span></button>
      </form>

      <p class="signup-prompt">New to E-Housing? <a href="register.html">Create an account</a></p>
    </section>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
